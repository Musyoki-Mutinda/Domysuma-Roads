<div class="hero-container" [style.transform]="'translateY(' + (scrollY * 0.25) + 'px)'">

  <!-- Parallax Background -->
  <div class="parallax-bg">
    <img src="assets/images/road.jpg" alt="Construction Background">
  </div>

  <div class="hero-content">
    <div class="content-wrapper">

      <div class="construction-title-container">

        <!-- ROW 1: Tipper Truck drives LEFT → RIGHT, letters appear in its wake -->
        <div class="title-row row-1">
          <div class="vehicle-runway">

            <div class="title-track" #row1Track>
              <span
                *ngFor="let item of row1Letters; let i = index"
                class="letter"
                [class.visible]="item.visible"
                [class.orange]="item.color === 'orange'"
                [class.white]="item.color === 'white'"
                [class.pour-in]="item.visible">
                <ng-container *ngIf="item.char === ' '">&nbsp;</ng-container>
                <ng-container *ngIf="item.char !== ' '">{{ item.char }}</ng-container>
              </span>
            </div>

            <!-- Tipper Truck SVG — absolutely positioned, animates across full runway -->
            <div class="vehicle-wrap tipper-wrap" *ngIf="isTruckActive">
              <span class="inline-vehicle tipper-truck"
                    [class.driving]="isTruckDriving"
                    [class.tipping]="isTipping">

                <!-- Debris particles -->
                <span class="debris d1" [class.active]="isTipping"></span>
                <span class="debris d2" [class.active]="isTipping"></span>
                <span class="debris d3" [class.active]="isTipping"></span>
                <span class="pour-dust" [class.active]="isTipping"></span>

                <!-- SVG Tipper Truck (orange, faces RIGHT) -->
                <svg class="vehicle-svg tipper-svg" viewBox="0 0 220 110" xmlns="http://www.w3.org/2000/svg">
                  <!-- Main chassis / frame -->
                  <rect x="10" y="58" width="195" height="28" rx="4" fill="#E05800"/>

                  <!-- Cab body -->
                  <rect x="130" y="28" width="68" height="42" rx="5" fill="#FF6B00"/>
                  <!-- Cab roof -->
                  <polygon points="134,28 194,28 198,14 148,14" fill="#FF8C00"/>
                  <!-- Cab window -->
                  <polygon points="148,15 193,15 193,27 148,27" fill="#B8D9E8" opacity="0.85"/>
                  <!-- Window glare -->
                  <line x1="153" y1="16" x2="153" y2="26" stroke="white" stroke-width="2" opacity="0.5"/>
                  <!-- Cab door line -->
                  <line x1="160" y1="28" x2="160" y2="58" stroke="#CC5500" stroke-width="1.5"/>
                  <!-- Door handle -->
                  <rect x="162" y="44" width="8" height="3" rx="1.5" fill="#CC5500"/>

                  <!-- Exhaust stack -->
                  <rect x="193" y="6" width="6" height="22" rx="3" fill="#333"/>
                  <rect x="191" y="4" width="10" height="5" rx="2" fill="#222"/>

                  <!-- Tipper bed — rotates upward from rear hinge on .tipping -->
                  <g class="tipper-bed">
                    <rect x="14" y="30" width="112" height="32" rx="3" fill="#CC5500"/>
                    <!-- Bed planks -->
                    <line x1="35" y1="30" x2="35" y2="62" stroke="#A84400" stroke-width="1.5"/>
                    <line x1="56" y1="30" x2="56" y2="62" stroke="#A84400" stroke-width="1.5"/>
                    <line x1="77" y1="30" x2="77" y2="62" stroke="#A84400" stroke-width="1.5"/>
                    <line x1="98" y1="30" x2="98" y2="62" stroke="#A84400" stroke-width="1.5"/>
                    <!-- Bed top rail -->
                    <rect x="14" y="28" width="112" height="5" rx="2" fill="#B84200"/>
                    <!-- Load (soil/gravel in bed) -->
                    <ellipse cx="63" cy="31" rx="48" ry="10" fill="#7B5C3A"/>
                    <ellipse cx="63" cy="30" rx="44" ry="7" fill="#8B6842"/>
                  </g>

                  <!-- Chassis details -->
                  <rect x="10" y="56" width="195" height="6" rx="2" fill="#B84200"/>
                  <!-- Step / running board -->
                  <rect x="136" y="72" width="55" height="5" rx="2" fill="#CC5500"/>

                  <!-- Rear axle housing -->
                  <rect x="20" y="82" width="60" height="8" rx="3" fill="#333"/>
                  <!-- Front axle housing -->
                  <rect x="148" y="82" width="42" height="8" rx="3" fill="#333"/>

                  <!-- Rear wheels (2 shown side by side for tandem) -->
                  <circle cx="38" cy="90" r="18" fill="#2A2A2A"/>
                  <circle cx="38" cy="90" r="13" fill="#3D3D3D"/>
                  <circle cx="38" cy="90" r="6" fill="#555"/>
                  <circle cx="38" cy="90" r="3" fill="#888"/>
                  <!-- Rear wheel 2 -->
                  <circle cx="62" cy="90" r="18" fill="#2A2A2A"/>
                  <circle cx="62" cy="90" r="13" fill="#3D3D3D"/>
                  <circle cx="62" cy="90" r="6" fill="#555"/>
                  <circle cx="62" cy="90" r="3" fill="#888"/>

                  <!-- Front wheel -->
                  <circle cx="172" cy="90" r="18" fill="#2A2A2A"/>
                  <circle cx="172" cy="90" r="13" fill="#3D3D3D"/>
                  <circle cx="172" cy="90" r="7" fill="#FF6B00"/>
                  <circle cx="172" cy="90" r="4" fill="#555"/>
                  <circle cx="172" cy="90" r="2" fill="#888"/>

                  <!-- Ground shadow -->
                  <ellipse cx="110" cy="108" rx="95" ry="4" fill="rgba(0,0,0,0.15)"/>
                </svg>

              </span>
            </div>

          </div>
        </div>

        <!-- ROW 2: Road Roller drives RIGHT → LEFT, letters appear in its wake -->
        <div class="title-row row-2">
          <div class="vehicle-runway">

            <div class="title-track" #row2Track>
              <span
                *ngFor="let item of row2Letters; let i = index"
                class="letter"
                [class.visible]="item.visible"
                [class.yellow]="item.color === 'yellow'"
                [class.stamp-in]="item.visible">
                <ng-container *ngIf="item.char === ' '">&nbsp;</ng-container>
                <ng-container *ngIf="item.char !== ' '">{{ item.char }}</ng-container>
              </span>
            </div>

            <!-- Road Roller SVG — enters from right, drives left (mirrored) -->
            <div class="vehicle-wrap roller-wrap" *ngIf="isRollerActive">
              <span class="inline-vehicle road-roller"
                    [class.driving]="isRollerDriving"
                    [class.active]="isRollerActive">

                <!-- Steam puffs above exhaust -->
                <span class="steam-puff" [class.active]="isRollerActive">
                  <span class="puff p1"></span>
                  <span class="puff p2"></span>
                  <span class="puff p3"></span>
                </span>

                <!-- SVG Road Roller (yellow, mirrored to face LEFT via CSS) -->
                <svg class="vehicle-svg roller-svg" viewBox="0 0 220 120" xmlns="http://www.w3.org/2000/svg">

                  <!-- === FRONT DRUM (large smooth roller) === -->
                  <g class="drum">
                    <!-- Drum outer shell -->
                    <ellipse cx="52" cy="88" rx="36" ry="36" fill="#555"/>
                    <ellipse cx="52" cy="88" rx="32" ry="32" fill="#666"/>
                    <!-- Drum face detail - conic look with radial lines -->
                    <ellipse cx="52" cy="88" rx="28" ry="28" fill="#777"/>
                    <line x1="52" y1="60" x2="52" y2="116" stroke="#555" stroke-width="1" opacity="0.6"/>
                    <line x1="24" y1="88" x2="80" y2="88" stroke="#555" stroke-width="1" opacity="0.6"/>
                    <line x1="32" y1="68" x2="72" y2="108" stroke="#555" stroke-width="1" opacity="0.4"/>
                    <line x1="72" y1="68" x2="32" y2="108" stroke="#555" stroke-width="1" opacity="0.4"/>
                    <!-- Drum hub -->
                    <circle cx="52" cy="88" r="10" fill="#444"/>
                    <circle cx="52" cy="88" r="5" fill="#999"/>
                    <!-- Drum rim flanges -->
                    <ellipse cx="52" cy="88" rx="36" ry="36" fill="none" stroke="#888" stroke-width="3"/>
                  </g>
                  <!-- Drum connecting arm to chassis -->
                  <rect x="52" y="68" width="28" height="10" rx="4" fill="#555"/>

                  <!-- === CHASSIS / FRAME === -->
                  <rect x="55" y="60" width="148" height="24" rx="4" fill="#F0B800"/>
                  <!-- Frame side detail -->
                  <rect x="55" y="60" width="148" height="8" rx="4" fill="#FFD700"/>

                  <!-- === CAB === -->
                  <!-- Cab body -->
                  <rect x="100" y="22" width="78" height="48" rx="6" fill="#FFD700"/>
                  <!-- Cab roof -->
                  <rect x="96" y="14" width="86" height="14" rx="4" fill="#E8C000"/>
                  <!-- Roof overhang shade -->
                  <rect x="94" y="24" width="90" height="4" rx="2" fill="#CCA800"/>

                  <!-- Cab windows (large, blue-tinted) -->
                  <!-- Front windshield -->
                  <rect x="165" y="24" width="32" height="28" rx="3" fill="#B8D9E8" opacity="0.9"/>
                  <line x1="170" y1="25" x2="170" y2="51" stroke="white" stroke-width="1.5" opacity="0.5"/>
                  <line x1="176" y1="24" x2="172" y2="52" stroke="white" stroke-width="1" opacity="0.3"/>
                  <!-- Side window -->
                  <rect x="108" y="26" width="52" height="24" rx="3" fill="#B8D9E8" opacity="0.85"/>
                  <line x1="116" y1="27" x2="116" y2="49" stroke="white" stroke-width="1.5" opacity="0.4"/>

                  <!-- Cab door details -->
                  <line x1="160" y1="22" x2="160" y2="70" stroke="#CCA800" stroke-width="1.5"/>
                  <!-- Door handle -->
                  <rect x="145" y="44" width="9" height="3" rx="1.5" fill="#CCA800"/>

                  <!-- === EXHAUST STACK === -->
                  <rect x="163" y="2" width="7" height="20" rx="3.5" fill="#333"/>
                  <rect x="161" y="0" width="11" height="6" rx="2" fill="#222"/>
                  <!-- Exhaust cap -->
                  <ellipse cx="167" cy="2" rx="7" ry="3" fill="#111"/>

                  <!-- === REAR DRUM / WHEEL === -->
                  <circle cx="182" cy="91" r="26" fill="#2A2A2A"/>
                  <circle cx="182" cy="91" r="20" fill="#3D3D3D"/>
                  <circle cx="182" cy="91" r="9" fill="#FFD700"/>
                  <circle cx="182" cy="91" r="5" fill="#555"/>
                  <circle cx="182" cy="91" r="2.5" fill="#aaa"/>
                  <!-- Wheel spokes -->
                  <line x1="182" y1="71" x2="182" y2="111" stroke="#555" stroke-width="2"/>
                  <line x1="162" y1="91" x2="202" y2="91" stroke="#555" stroke-width="2"/>
                  <line x1="168" y1="77" x2="196" y2="105" stroke="#555" stroke-width="1.5"/>
                  <line x1="196" y1="77" x2="168" y2="105" stroke="#555" stroke-width="1.5"/>

                  <!-- === VIBRATORY PLATE / BOTTOM CHASSIS === -->
                  <rect x="70" y="82" width="100" height="10" rx="3" fill="#E8C000"/>

                  <!-- === STEP / LADDER (right side of cab) === -->
                  <rect x="200" y="58" width="8" height="4" rx="1" fill="#CCA800"/>
                  <rect x="200" y="64" width="8" height="4" rx="1" fill="#CCA800"/>

                  <!-- Ground shadow -->
                  <ellipse cx="117" cy="118" rx="100" ry="4" fill="rgba(0,0,0,0.15)"/>
                </svg>

              </span>
            </div>

          </div>
        </div>

      </div>

      <!-- Subtitle -->
      <p class="hero-subtitle" *ngIf="animationComplete" [@fadeIn]>
        Infrastructure That Lasts Generations
      </p>

      <!-- CTA Buttons -->
      <div class="hero-actions" *ngIf="animationComplete" [@fadeIn]>
        <a routerLink="/quote" class="btn-primary">
          Request a Quote
          <i class="fas fa-arrow-right"></i>
        </a>
        <a routerLink="/projects" class="btn-secondary">
          View Our Work
        </a>
      </div>

      <!-- Trust Badges -->
      <div class="trust-badges" *ngIf="animationComplete" [@fadeIn]>
        <div class="badge">
          <i class="fas fa-certificate"></i>
          <span>NCA Registered</span>
        </div>
        <div class="badge">
          <i class="fas fa-shield-alt"></i>
          <span>ISO Certified</span>
        </div>
        <div class="badge">
          <i class="fas fa-award"></i>
          <span>9 Years Excellence</span>
        </div>
      </div>

    </div>
  </div>

</div>
