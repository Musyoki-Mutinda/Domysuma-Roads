<section class="services-sec">
  <!-- Background Construction Animation -->
  <div class="construction-background">
    <div class="construction-line"></div>
    <div class="construction-line"></div>
    <div class="construction-line"></div>
    <div class="construction-particles">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>
  </div>

  <section class="section-header">
    <h2 class="animated-title">Our Services</h2>
    <p class="subtitle">Building the Future, One Project at a Time</p>
  </section>

  <section class="services-cards-sec">
    <div
      class="services-card"
      *ngFor="let s of services; let i = index"
    >
      <div class="card-icon-container">
        <i class="icon-custom-with-bg fa-solid" [ngClass]="s.icon"></i>
        <div class="pulse-ring"></div>
        <div class="pulse-ring secondary"></div>
      </div>

      <div class="card-content">
        <h4 class="card-title">{{ s.title }}</h4>
        <p class="card-description">{{ s.description }}</p>
        
        <div class="key-features">
          <h5>Key Features:</h5>
          <ul>
            <li *ngFor="let feature of s.keyFeatures">
              <i class="fas fa-check"></i> {{ feature }}
            </li>
          </ul>
        </div>
      </div>

      <div class="card-glow"></div>
    </div>
  </section>
</section>
