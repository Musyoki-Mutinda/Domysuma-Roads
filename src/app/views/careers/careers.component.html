<section class="careers-page">

  <!-- Hero Section -->
  <section class="careers-hero fade-up" appInView>
    <!-- Background Slideshow -->
    <div class="bg-slideshow">
      <div
        *ngFor="let image of careerImages; let i = index"
        class="bg-image"
        [class.active]="i === bgImageIndex"
        [style.backgroundImage]="'url(' + image + ')'"
      ></div>
    </div>

    <div class="hero-left" style="position: relative; z-index: 2;">
      <span class="hero-tagline">— Join Our Team —</span>
      <h1>
        Build with Us<br>
        at <span class="highlight">Domysuma</span>
      </h1>
      <p class="hero-sub">We are the people who build & deliver.</p>

      <div class="hero-actions">
        <!--<button class="btn-primary" routerLink="/about">About Us</button>-->
        <button class="btn-outline" (click)="navigateToCareers()">Vacancies</button>
      </div>

      <!--<div class="hot-vacancies">
        <strong>Hot vacancies:</strong>
        <span>Site Engineer, Project Manager, Quantity Surveyor, Safety Officer</span>
      </div>-->
    </div> 
  </section>

</section>
